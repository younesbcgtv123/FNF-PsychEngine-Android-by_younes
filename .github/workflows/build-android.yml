name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Psych Engine
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Install hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp 4.2.0
          haxelib set hxcpp 4.2.0

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib run lime setup android

      - name: Install libraries
        run: |
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install tjson 1.4.0
          haxelib install flxanimate
          haxelib install hscript-iris 1.1.3

      - name: Install LuaJIT
        run: |
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git

      - name: Create keystore
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkeypair \
              -keystore key.keystore \
              -alias 1 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Psych Engine, OU=Android, O=Psych Engine, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Check environment
        run: |
          echo "Java:"
          java -version

          echo "Haxe:"
          haxe --version

          echo "Haxelib:"
          haxelib list

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "ND