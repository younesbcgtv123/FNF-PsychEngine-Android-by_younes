name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Psych Engine Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Setup Haxelib
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Install hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp 4.2.0
          haxelib set hxcpp 4.2.0

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib run lime setup android

      - name: Install Psych Engine libraries
        run: |
          haxelib install flixel 5.6.1
          haxelib install flixel-addons 3.2.2
          haxelib install tjson 1.4.0
          haxelib install flxanimate
          haxelib install hscript-iris 1.1.3

      - name: Install LuaJIT
        run: |
          haxelib remove linc_luajit || true
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git

      - name: Create Android keystore
        run: |
          if [ ! -f key.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore key.keystore \
              -alias 1 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Psych Engine, OU=Android, O=Psych Engine, L=Unknown, ST=Unknown, C=US"
          fi

      - name: Build APK
        run: |
          chmod +x quick_build.sh
          ./quick_build.sh release

      - name: Show generated APK
        run: |
          echo "Searching for generated APK files..."
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychEngine-Android
          path: export/**/*.apk
          if-no-files-found: error